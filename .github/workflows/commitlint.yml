# Conventional Commits enforcement for pull requests.
#
# The local `.husky/commit-msg` hook runs the same commitlint config before a
# commit is created, so bad messages are usually caught on the developer's
# machine. This workflow is the backstop that runs on GitHub, so a branch can't
# be merged while any of its commits break the convention.
#
# Rules live in commitlint.config.mjs.
name: commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 pulls the full history so the PR's base commit is present
      # and commitlint can lint the whole base..head range.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        run: >-
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
