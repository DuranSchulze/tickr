<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Trackly</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #f7f5f5;
        color: #1c2024;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161c24;
          color: #f2f3f5;
        }
        .card {
          background: #1c242e;
          border-color: #2a333f;
        }
        .badge {
          background: rgb(23 182 168 / 0.15);
        }
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #e6e2e1;
        border-radius: 16px;
        padding: 40px 28px;
      }
      .badge {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: rgb(0 144 132 / 0.12);
        color: #009084;
      }
      .badge svg {
        width: 28px;
        height: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.6;
        opacity: 0.75;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: #009084;
        cursor: pointer;
      }
      button:hover {
        background: #007a70;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h.01" />
          <path
            d="M2 8.82a15 15 0 0 1 20 0"
            opacity="0.35"
          />
          <path
            d="M5 12.859a10 10 0 0 1 14 0"
            opacity="0.6"
          />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Trackly needs a connection to sync your time entries. Your timer keeps
        running — reconnect and everything picks up where you left off.
      </p>
      <button onclick="location.replace(document.referrer || '/')">
        Try again
      </button>
    </main>
  </body>
</html>
